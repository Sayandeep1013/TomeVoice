name: tomevoice_spike
description: >-
  TomeVoice reader. Opens EPUB, PDF, DOCX, MOBI/AZW3, ODT, FB2, RTF, HTML,
  Markdown and text, and reads them aloud with the owned audio pipeline.
  See docs/16-session-handoff.md.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  tomevoice_audio:
    path: ../packages/tomevoice_audio
  tomevoice_document:
    path: ../packages/tomevoice_document
  # Jump to any paragraph of a 17,000-item book without building the ones in
  # between. BSD-3-Clause (Google), GPL-3.0 compatible.
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/brand/logo.png

  # Bundled, not fetched at runtime: the app is offline-first, and a reading
  # app whose type disappears without a network is not offline-first.
  # Both faces are SIL Open Font License 1.1, which is GPL-3.0 compatible;
  # licence texts ship alongside them in assets/fonts/.
  fonts:
    - family: Ojuju
      fonts:
        - asset: assets/fonts/Ojuju-Variable.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
