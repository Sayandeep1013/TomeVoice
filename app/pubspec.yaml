name: tomevoice_spike
description: >-
  Audio-engine spike for TomeVoice. One screen, deliberately unstyled: prove
  that word timings can be captured from a real TTS engine and that word-gap
  injection lands where it claims to. See docs/15-spike-audio-engine.md.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  tomevoice_audio:
    path: ../packages/tomevoice_audio

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  # Bundled, not fetched at runtime: the app is offline-first, and a reading
  # app whose type disappears without a network is not offline-first.
  # Both faces are SIL Open Font License 1.1, which is GPL-3.0 compatible;
  # licence texts ship alongside them in assets/fonts/.
  fonts:
    - family: Ojuju
      fonts:
        - asset: assets/fonts/Ojuju-Variable.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
