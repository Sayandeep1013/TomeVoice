name: tomevoice_spike
description: >-
  TomeVoice reader. Opens EPUB, PDF, DOCX, MOBI/AZW3, ODT, FB2, RTF, HTML,
  Markdown and text, and reads them aloud with the owned audio pipeline.
  See docs/16-session-handoff.md.
publish_to: none
version: 0.5.0+6

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  tomevoice_audio:
    path: ../packages/tomevoice_audio
  tomevoice_document:
    path: ../packages/tomevoice_document
  # Jump to any paragraph of a 17,000-item book without building the ones in
  # between. BSD-3-Clause (Google), GPL-3.0 compatible.
  scrollable_positioned_list: ^0.3.8
  # QuickJS, to run LNReader source plugins (web novels). MIT, as is the
  # QuickJS it vendors. Pinned by commit: a single-maintainer git package,
  # the one Mangayomi uses. Builds through Flutter's native-assets hook.
  flutter_qjs:
    git:
      url: https://github.com/kodjodevf/flutter_qjs.git
      ref: b64d2e3a8b2bf3b32ab4c3acef34a11636d5b87f

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # Only the licence texts: listing the folder would ship every font twice.
    - assets/fonts/OFL-BodoniModa.txt
    - assets/fonts/OFL-Figtree.txt
    - assets/fonts/OFL-Newsreader.txt
    - assets/fonts/OFL-Literata.txt
    - assets/brand/logo.png
    # The libraries LNReader source plugins use, and TomeVoice's host for
    # them (tools/lnreader_libs builds the first).
    - assets/js/lnreader_libs.js
    - assets/js/lnreader_shim.js
    - assets/licenses/third_party.txt
    # The book a new install starts with (public domain; see starter.dart).
    - assets/starter/pride-and-prejudice.epub

  # Bundled, not fetched at runtime: the app is offline-first, and a reading
  # app whose type disappears without a network is not offline-first.
  # All four families are SIL Open Font License 1.1, which is GPL-3.0
  # compatible; licence texts ship alongside them in assets/fonts/ and are
  # listed on the About screen. Each is one variable file; weights and
  # optical sizes are chosen with font variations (see theme.dart).
  fonts:
    # Titles, the wordmark and chapter openings.
    - family: BodoniModa
      fonts:
        - asset: assets/fonts/BodoniModa-Variable.ttf
        - asset: assets/fonts/BodoniModa-Italic-Variable.ttf
          style: italic
    # Everything you tap and read as interface.
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Variable.ttf
    # The page: Newsreader by default, Literata as the alternative.
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Variable.ttf
