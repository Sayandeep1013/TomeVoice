name: build

# Builds cost minutes, so only the pushes that matter build: main, pull
# requests, and a manual "Run workflow" (gh workflow run build.yml --ref <branch>)
# for a feature branch. Docs-only changes never build an APK.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "mobile-qa/**", "spike-runs/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "mobile-qa/**", "spike-runs/**"]
  workflow_dispatch:

# A newer push to the same ref makes the older build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate that matters day to day. Runs in seconds, needs no Android
  # toolchain, and covers everything intellectually risky in the project.
  dart-core:
    name: Dart core (pipeline + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve audio
        working-directory: packages/tomevoice_audio
        run: dart pub get

      - name: Analyze audio
        working-directory: packages/tomevoice_audio
        run: dart analyze --fatal-infos

      - name: Test audio
        working-directory: packages/tomevoice_audio
        run: dart test --reporter expanded

      - name: Resolve document
        working-directory: packages/tomevoice_document
        run: dart pub get

      - name: Analyze document
        working-directory: packages/tomevoice_document
        run: dart analyze --fatal-infos

      - name: Test document
        working-directory: packages/tomevoice_document
        run: dart test --reporter expanded

      - name: Resolve tools
        working-directory: tools
        run: dart pub get

      - name: Analyze tools
        working-directory: tools
        run: dart analyze --fatal-infos

      # Exercises the offline verifier end to end without a device: build a
      # synthetic run, then check it. Guards the measurement instrument itself —
      # if `measure.dart` regresses, every result it later certifies is worthless.
      - name: Verifier round-trip
        working-directory: tools
        run: |
          set -e
          for spec in "120 1.0" "120 2.0" "250 1.0" "0 1.0"; do
            set -- $spec
            gap=$1; speed=$2
            echo "::group::gap=${gap}ms speed=${speed}x"
            dart run bin/make_fixture.dart "/tmp/fixture-${gap}-${speed}" "$gap" "$speed"
            dart run bin/measure.dart "/tmp/fixture-${gap}-${speed}"
            echo "::endgroup::"
          done

  # Only runs if the core is green, so a broken pipeline never produces an
  # installable build.
  android-apk:
    name: Android release APK
    runs-on: ubuntu-latest
    needs: dart-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Gradle, AGP and PdfBox downloads dominate a cold Android build.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml', 'tools/prepare_android.py') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Show toolchain
        run: flutter --version

      # There is no committed android/ directory: the developer has no local
      # Flutter install (docs/10 ADR-016), so the platform scaffolding is
      # generated here and our sources are laid back over it. This also means
      # the project self-heals across Flutter template changes.
      - name: Generate Android scaffolding
        working-directory: app
        run: |
          cp -r lib /tmp/tv_lib
          cp -r test /tmp/tv_test
          cp pubspec.yaml /tmp/tv_pubspec.yaml
          flutter create --platforms=android --project-name tomevoice_spike --org app.tomevoice .
          # flutter create writes lib/main.dart and pubspec.yaml, and also a
          # stub test/widget_test.dart referencing a MyApp class this project
          # does not have. All three are ours; restore all three.
          rm -rf lib test
          cp -r /tmp/tv_lib lib
          cp -r /tmp/tv_test test
          cp /tmp/tv_pubspec.yaml pubspec.yaml

      # A stable key means each build installs over the last one. Without the
      # secret the APK is signed with a throwaway key and needs an uninstall
      # (which wipes the library) before it will install.
      - name: Restore signing key
        env:
          TV_KEYSTORE_B64: ${{ secrets.TV_KEYSTORE_B64 }}
        run: |
          if [ -n "$TV_KEYSTORE_B64" ]; then
            echo "$TV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tomevoice.p12"
            echo "TV_KEYSTORE=$RUNNER_TEMP/tomevoice.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::TV_KEYSTORE_B64 is not set; the APK will need an uninstall to install."
          fi

      - name: Apply our Android sources
        working-directory: app
        run: |
          cp -r android_overlay/. android/
          python3 ../tools/prepare_android.py .

      - name: Verify the overlay landed
        working-directory: app
        run: |
          set -e
          K=android/app/src/main/kotlin/app/tomevoice/tomevoice_spike
          M=android/app/src/main/AndroidManifest.xml
          for f in MainActivity PcmPlayer ReadAloudService PdfText; do test -f "$K/$f.kt"; done
          grep -q "tomevoice/tts" "$K/MainActivity.kt"
          grep -q "TTS_SERVICE" "$M"
          grep -q "ReadAloudService" "$M"
          grep -q 'foregroundServiceType="mediaPlayback"' "$M"
          grep -q 'android:label="TomeVoice"' "$M"
          grep -q "pdfbox-android" android/app/build.gradle.kts
          test -f android/app/proguard-rules.pro
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -E "minSdk|targetSdk" android/app/build.gradle.kts

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Widget tests
        working-directory: app
        run: flutter test

      # Release, not debug: a debug build runs Dart unoptimised (JIT with
      # asserts) and was several times slower at everything the user touches.
      # arm64 only: every phone this is installed on is arm64, and one ABI is
      # a smaller APK and a faster build.
      - name: Build release APK
        working-directory: app
        env:
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: tomevoice-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
