# The website, https://sayandeep1013.github.io/TomeVoice/: site/ with the
# README's screenshots and the app's icon. The APKs stay on Releases; the
# page links to the latest release's files.
name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - app/assets/brand/icon.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the site together
        run: |
          mkdir -p _site/images
          cp site/* _site/
          cp docs/images/*.png _site/images/
          cp app/assets/brand/icon.png _site/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
