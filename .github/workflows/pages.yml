# The website, https://sayandeep1013.github.io/TomeVoice/: site/ with the
# README's screenshots and the app's icon. The APKs stay on Releases; the
# page links to the latest release's files.
name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - app/assets/brand/icon.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pinned to commits, as in build.yml. The v4 Pages actions ran on
      # Node 20, forced onto Node 24 runners, and deploy-pages could no
      # longer read the uploaded site ("No artifacts named github-pages").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Put the site together
        run: |
          mkdir -p _site/images
          cp site/* _site/
          cp docs/images/*.png _site/images/
          cp app/assets/brand/icon.png _site/icon.png
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
