# Subflow: a new install's shelf gets the starter's two web novels a
# moment after Pride and Prejudice, one after the other, when the network
# allows, and they take the first places. Wait for both (or a while,
# offline) so that no tap lands where a book was a moment before.
appId: ${APP_ID || 'app.tomevoice'}
---
- extendedWaitUntil:
    visible: ".*Shadow Slave.*"
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: ".*Lord of the Mysteries.*"
    timeout: 30000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
