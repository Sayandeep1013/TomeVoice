name: tomevoice_document
description: >-
  Document Model (Contract A) and ingestion for TomeVoice. Turns EPUB, TXT,
  Markdown and HTML bytes into a linear speakable Book. No Flutter dependency.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  archive: ^4.0.0
  crypto: ^3.0.5
  xml: ^6.5.0

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
